<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 - 基于Pcap的网络流量分析平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "DM Sans", "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      background-image:
        radial-gradient(ellipse 120% 80% at 20% -20%, rgba(99, 102, 241, 0.45), transparent 50%),
        radial-gradient(ellipse 80% 60% at 100% 50%, rgba(14, 165, 233, 0.2), transparent 45%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-wrap {
      width: 100%;
      max-width: 1040px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
    }
    @media (max-width: 767px) {
      .auth-wrap { grid-template-columns: 1fr; }
      .auth-hero { min-height: 180px; padding: 24px !important; }
    }
    .auth-hero {
      background: linear-gradient(145deg, #312e81 0%, #1e1b4b 100%);
      color: #e0e7ff;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .auth-hero .badge-thesis {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #a5b4fc;
      margin-bottom: 12px;
    }
    .auth-hero h1 {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.45;
      color: #fff;
    }
    .auth-hero p { margin: 12px 0 0; font-size: 0.88rem; opacity: 0.88; line-height: 1.6; }
    .auth-panel { background: #fff; padding: 44px 40px; }
    .auth-panel h2 { font-size: 1.35rem; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
    .auth-panel .sub { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
    .form-control:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
    .btn-reg {
      background: linear-gradient(120deg, #4f46e5, #6366f1);
      border: none;
      font-weight: 600;
      padding: 12px;
      border-radius: 10px;
    }
    .btn-reg:hover { filter: brightness(1.05); }
    .link-muted a { color: #6366f1; font-weight: 600; text-decoration: none; }
    .link-muted a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-hero">
      <span class="badge-thesis">毕业设计课题</span>
      <h1>基于 Pcap 的网络流量分析平台的设计与实现</h1>
      <p>注册后即可上传 pcap/cap，使用协议统计、时序分析、会话与 IP 视图及安全告警模块。</p>
    </div>
    <div class="auth-panel">
      <h2>用户注册</h2>
      <p class="sub">创建账号以使用分析工作台</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold small text-secondary">用户名</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small text-secondary">密码（至少 6 位）</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold small text-secondary">确认密码</label>
          <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <button class="btn btn-primary btn-reg w-100 text-white" type="submit">注册</button>
      </form>
      <p class="link-muted text-center mt-4 mb-0 small text-secondary">
        已有账号？<a href="{{ url_for('login') }}">返回登录</a>
      </p>
    </div>
  </div>
</body>
</html>
