<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 基于Pcap的网络流量分析平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,700;1,9..40,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1e293b;
      --violet: #6366f1;
      --violet-dark: #4f46e5;
    }
    body {
      font-family: "DM Sans", "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      background-image:
        radial-gradient(ellipse 120% 80% at 20% -20%, rgba(99, 102, 241, 0.12), transparent 50%),
        radial-gradient(ellipse 80% 60% at 100% 50%, rgba(14, 165, 233, 0.1), transparent 45%),
        radial-gradient(circle at 80% 100%, rgba(139, 92, 246, 0.08), transparent 40%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-wrap {
      width: 100%;
      max-width: 1040px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.1);
      border: 1px solid #e2e8f0;
    }
    @media (max-width: 767px) {
      .auth-wrap { grid-template-columns: 1fr; }
      .auth-hero { min-height: 200px; padding: 28px !important; }
    }
    .auth-hero {
      background: linear-gradient(145deg, #eef2ff 0%, #e0e7ff 50%, #f8fafc 100%);
      color: #334155;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      border-right: 1px solid #e2e8f0;
    }
    .auth-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%236366f1' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }
    .auth-hero h1 {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.45;
      color: var(--ink);
      position: relative;
      z-index: 1;
    }
    .auth-hero .badge-thesis {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--violet-dark);
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }
    .auth-hero p {
      margin: 16px 0 0;
      font-size: 0.92rem;
      line-height: 1.65;
      color: #64748b;
      max-width: 28rem;
      position: relative;
      z-index: 1;
    }
    .auth-panel {
      background: #fff;
      padding: 44px 40px;
    }
    .auth-panel h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .auth-panel .sub {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }
    .form-control:focus {
      border-color: var(--violet);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    .btn-login {
      background: linear-gradient(120deg, var(--violet-dark), var(--violet));
      border: none;
      font-weight: 600;
      padding: 12px;
      border-radius: 10px;
    }
    .btn-login:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }
    .link-muted a { color: var(--violet); font-weight: 600; text-decoration: none; }
    .link-muted a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-hero">
      <span class="badge-thesis">毕业设计课题</span>
      <h1>基于 Pcap 的网络流量分析平台的设计与实现</h1>
      <p>支持数据包上传、协议与时序统计、TCP 会话还原、敏感信息识别与安全告警检测。登录后进入分析工作台。</p>
    </div>
    <div class="auth-panel">
      <h2>用户登录</h2>
      <p class="sub">使用已注册账号访问系统</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold small text-secondary">用户名</label>
          <input type="text" name="username" class="form-control form-control-lg" autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold small text-secondary">密码</label>
          <input type="password" name="password" class="form-control form-control-lg" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-login w-100 text-white" type="submit">登录</button>
      </form>
      <p class="link-muted text-center mt-4 mb-0 small text-secondary">
        还没有账号？<a href="{{ url_for('register') }}">注册新用户</a>
      </p>
    </div>
  </div>
</body>
</html>
